name: 自动部署节点订阅管理器到SAP

on:

  workflow_dispatch:  # 只允许手动触发

    inputs:

      region:

        description: '选择部署区域'

        required: true

        default: 'US(free)'

        type: choice

        options:

          # 免费区域

          - SG(free)

          - US(free)

          # SAP 区域

          - SAP-UAE(Dubai)

          - SAP-AU(Sydney)

          - SAP-US(Sterling)

          - SAP-US-West(Colorado)

          - SAP-JP(Tokyo)

          # AWS 区域

          - AWS-AU(Sydney)

          - AWS-BR(São Paulo)

          - AWS-KR(Seoul)

          - AWS-CA(Montreal)

          - AWS-US(VA)

          - AWS-US(OR)

          - AWS-EU(Frankfurt)

          - AWS-JP(Tokyo)

          - AWS-SG(Singapore)

          # GCP 区域

          - GCP-AU(Sydney)

          - GCP-BR(São Paulo)

          - GCP-US(IA)

          - GCP-EU(Frankfurt)

          - GCP-JP(Osaka)

          - GCP-JP(Tokyo)

          - GCP-IL(Tel Aviv)

          - GCP-IN(Mumbai)

          - GCP-KSA(Dammam)

          # Azure 区域

          - Azure-AU(Sydney)

          - Azure-BR(São Paulo)

          - Azure-CA(Montreal)

          - Azure-US(VA)

          - Azure-US(WA)

          - Azure-EU(Netherlands)

          - Azure-JP(Tokyo)

          - Azure-SG(Singapore)

          # SAP Neo 区域

          - Neo-UAE(Dubai)

          - Neo-KSA(Riyadh)

      app_name:

        description: '应用名称（可选，留空则自动生成）'

        required: false

        default: ''

env:

  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE || 'eooce/merge-sub:latest' }}

  MEMORY: ${{ secrets.MEMORY || '256M' }}

  DISK: ${{ secrets.DISK || '256M' }}

jobs:

  deploy-app:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code

        uses: actions/checkout@v4

      # ✅ 新增 Node.js 步骤

      - name: Setup Node.js

        uses: actions/setup-node@v3

        with:

          node-version: '24'

      - name: Install CF CLI

        run: |

          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -

          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list

          sudo apt-get update

          sudo apt-get install -y cf8-cli

      - name: Determine CF API endpoint and app name

        run: |

          RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)

          case "${{ github.event.inputs.region }}" in

            "SG(free)") echo "CF_API=https://api.cf.ap21.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=merge-freesg$RANDOM_STR" >> $GITHUB_ENV ;;

            "US(free)") echo "CF_API=https://api.cf.us10-001.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=merge-freeus$RANDOM_STR" >> $GITHUB_ENV ;;

            "SAP-UAE(Dubai)") echo "CF_API=https://api.cf.ae01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-ae$RANDOM_STR" >> $GITHUB_ENV ;;

            "SAP-AU(Sydney)") echo "CF_API=https://api.cf.ap01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-ap$RANDOM_STR" >> $GITHUB_ENV ;;

            "SAP-US(Sterling)") echo "CF_API=https://api.cf.us01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-us1$RANDOM_STR" >> $GITHUB_ENV ;;

            "SAP-US-West(Colorado)") echo "CF_API=https://api.cf.us02.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-us2$RANDOM_STR" >> $GITHUB_ENV ;;

            "SAP-JP(Tokyo)") echo "CF_API=https://api.cf.jp01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-jp$RANDOM_STR" >> $GITHUB_ENV ;;

            # AWS/GCP/Azure/SAP Neo 区域略，可按原来逻辑复制

          esac

          if [ -n "${{ github.event.inputs.app_name }}" ]; then

            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV

          fi

          echo "使用API端点: $CF_API"

          echo "应用名称: $APP_NAME"

      - name: Login to Cloud Foundry

        run: |

          cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"

          ORG=$(cf orgs | sed -n '4p'); echo "ORG=$ORG" >> $GITHUB_ENV

          SPACE=$(cf spaces | sed -n '4p'); echo "SPACE=$SPACE" >> $GITHUB_ENV

          cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

      - name: Deploy application

        run: |

          if cf push ${{ env.APP_NAME }} --docker-image ${{ env.DOCKER_IMAGE }} -m ${{ env.MEMORY }} -k ${{ env.DISK }} --health-check-type port; then

            echo "Deployment successful"

          else

            cf delete ${{ env.APP_NAME }} -r -f

            echo "部署失败，已清理残留"

            exit 1

          fi

      - name: Verify deployment

        run: |

          STATUS=$(cf app ${{ env.APP_NAME }} | grep "requested state:" | awk '{print $3}')

          if [ "$STATUS" = "started" ]; then

            echo "✅ merge启动成功"

          else

            echo "❌ 应用启动失败，当前状态: $STATUS"

            cf logs ${{ env.APP_NAME }} --recent

            exit 1

          fi

      - name: Deployment info

        run: |

          echo "区域(Region): ${{ github.event.inputs.region }}"

          echo "组织(ORG): ${{ env.ORG }}"

          echo "空间(SPACE): ${{ env.SPACE }}"

          echo "应用名称(App Name): ${{ env.APP_NAME }}"

          ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')

          if [ -n "$ROUTE" ]; then

            echo "merge—URL: https://$ROUTE"

          else

            echo "⚠️ 未找到应用路由，请检查部署状态。"

          fi
