name: 自动部署代理到SAP

on:
  workflow_dispatch:
    inputs:
      type:
        description: '选择部署的节点类型'
        required: true
        default: 'Argo隧道CDN'
        type: choice
        options:
          - ws直连
          - xhttp直连
          - Argo隧道CDN
      region:
        description: '选择部署区域'
        required: true
        default: 'US(free)'
        type: choice
        options:
          - SG(free)
          - US(free)
          - SAP-UAE(Dubai)
          - SAP-AU(Sydney)
          - SAP-US(Sterling)
          - SAP-US-West(Colorado)
          - SAP-JP(Tokyo)
          # 其他区域可按原来的列表补充
      app_name:
        description: '应用名称（可选，留空则自动生成）'
        required: false
        default: ''

env:
  MEMORY: 256M
  DISK: 300M
  CUSTOM_NODE_IMAGE: ghcr.io/你的账号/nodejs:v24  # 构建后的自定义 Node.js 24 镜像

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ 安装 Docker
      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      # 3️⃣ 构建自定义 Node.js 24 Docker 镜像（如果默认镜像不是直连镜像）
      - name: Build custom Node.js Docker image
        run: |
          if [[ "${{ github.event.inputs.type }}" != "ws直连" && "${{ github.event.inputs.type }}" != "xhttp直连" ]]; then
            echo "FROM ghcr.io/eooce/nodejs:main" > Dockerfile.tmp
            echo "RUN curl -fsSL https://deb.nodesource.com/setup_24.x | bash -" >> Dockerfile.tmp
            echo "RUN apt-get install -y nodejs" >> Dockerfile.tmp
            docker build -t ${{ env.CUSTOM_NODE_IMAGE }} -f Dockerfile.tmp .
            docker push ${{ env.CUSTOM_NODE_IMAGE }}
            echo "DOCKER_IMAGE=${{ env.CUSTOM_NODE_IMAGE }}" >> $GITHUB_ENV
          else
            if [ "${{ github.event.inputs.type }}" = "ws直连" ]; then
              echo "DOCKER_IMAGE=ghcr.io/eooce/ws:latest" >> $GITHUB_ENV
            else
              echo "DOCKER_IMAGE=ghcr.io/eooce/goxhttp:latest" >> $GITHUB_ENV
            fi
          fi

      # 4️⃣ 安装 CF CLI
      - name: Install CF CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      # 5️⃣ 设置 CF API 和 APP 名
      - name: Determine CF API endpoint and app name
        run: |
          RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)
          case "${{ github.event.inputs.region }}" in
            "SG(free)") echo "CF_API=https://api.cf.ap21.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=free-sg$RANDOM_STR" >> $GITHUB_ENV ;;
            "US(free)") echo "CF_API=https://api.cf.us10-001.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=free-us$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-UAE(Dubai)") echo "CF_API=https://api.cf.ae01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-ae$RANDOM_STR" >> $GITHUB_ENV ;;
            # 其他区域可按原来逻辑补充
          esac
          if [ -n "${{ github.event.inputs.app_name }}" ]; then
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
          fi
          echo "使用 API: $CF_API"
          echo "应用名称: $APP_NAME"
          echo "部署镜像: $DOCKER_IMAGE"

      # 6️⃣ 登录 CF
      - name: Login to Cloud Foundry
        run: |
          cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"
          ORG=$(cf orgs | sed -n '4p'); echo "ORG=$ORG" >> $GITHUB_ENV
          SPACE=$(cf spaces | sed -n '4p'); echo "SPACE=$SPACE" >> $GITHUB_ENV
          cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

      # 7️⃣ 部署应用
      - name: Deploy application
        run: |
          if cf push ${{ env.APP_NAME }} --docker-image ${{ env.DOCKER_IMAGE }} -m ${{ env.MEMORY }} -k ${{ env.DISK }} --health-check-type port; then
            echo "Deployment successful"
          else
            cf delete ${{ env.APP_NAME }} -r -f
            echo "部署失败，已清理残留"
            exit 1
          fi

      # 8️⃣ 设置环境变量
      - name: Set environment variables
        run: |
          cf set-env ${{ env.APP_NAME }} NAME "SAP"
          cf set-env ${{ env.APP_NAME }} UUID "${{ secrets.UUID }}"
          cf set-env ${{ env.APP_NAME }} NEZHA_SERVER "${{ secrets.NEZHA_SERVER }}"
          cf set-env ${{ env.APP_NAME }} NEZHA_PORT "${{ secrets.NEZHA_PORT }}"
          cf set-env ${{ env.APP_NAME }} NEZHA_KEY "${{ secrets.NEZHA_KEY }}"
          cf set-env ${{ env.APP_NAME }} ARGO_PORT "${{ secrets.ARGO_PORT }}"
          cf set-env ${{ env.APP_NAME }} ARGO_DOMAIN "${{ secrets.ARGO_DOMAIN }}"
          cf set-env ${{ env.APP_NAME }} ARGO_AUTH "${{ secrets.ARGO_AUTH }}"
          cf set-env ${{ env.APP_NAME }} SUB_PATH "${{ secrets.SUB_PATH }}"
          cf set-env ${{ env.APP_NAME }} CFIP "${{ secrets.CFIP || 'cf.877774.xyz' }}"
          cf set-env ${{ env.APP_NAME }} CFPORT "${{ secrets.CFPORT }}"
          cf set-env ${{ env.APP_NAME }} CHAT_ID "${{ secrets.CHAT_ID }}"
          cf set-env ${{ env.APP_NAME }} BOT_TOKEN "${{ secrets.BOT_TOKEN }}"

      # 9️⃣ Restage
      - name: Restage application
        run: cf restage ${{ env.APP_NAME }}

      # 🔟 验证部署
      - name: Verify deployment
        run: |
          cf app ${{ env.APP_NAME }}
          echo "Deployment completed successfully!"

      # 11️⃣ 输出详细信息
      - name: Deployment info
        run: |
          echo "区域(Region): ${{ github.event.inputs.region }}"
          echo "组织(ORG): ${{ env.ORG }}"
          echo "空间(SPACE): ${{ env.SPACE }}"
          echo "应用名称(App Name): ${{ env.APP_NAME }}"
          ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')
          if [ -n "$ROUTE" ]; then
            echo "应用 URL (APP_URL): https://$ROUTE"
          else
            echo "⚠️ 未找到应用路由，请检查部署状态。"
          finame: 自动部署代理到SAP

