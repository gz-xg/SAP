name: 自动部署节点订阅管理器到SAP

on:
  workflow_dispatch:
    inputs:
      region:
        description: '选择部署区域'
        required: true
        default: 'US(free)'
        type: choice
        options:
          # 免费区域
          - SG(free)
          - US(free)
          # SAP 区域
          - SAP-UAE(Dubai)
          - SAP-AU(Sydney)
          - SAP-US(Sterling)
          - SAP-US-West(Colorado)
          - SAP-JP(Tokyo)
          # AWS/GCP/Azure/SAP Neo 区域按你原来的逻辑填入
      app_name:
        description: '应用名称（可选，留空则自动生成）'
        required: false
        default: ''

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE || 'eooce/merge-sub:latest' }}
  MEMORY: ${{ secrets.MEMORY || '256M' }}
  DISK: ${{ secrets.DISK || '256M' }}

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ 设置 Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      # 3️⃣ 安装 CF CLI
      - name: Install CF CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      # 4️⃣ 生成随机 APP 名和 CF API 端点
      - name: Determine CF API endpoint and app name
        run: |
          RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)
          case "${{ github.event.inputs.region }}" in
            "SG(free)") echo "CF_API=https://api.cf.ap21.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=merge-freesg$RANDOM_STR" >> $GITHUB_ENV ;;
            "US(free)") echo "CF_API=https://api.cf.us10-001.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=merge-freeus$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-UAE(Dubai)") echo "CF_API=https://api.cf.ae01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-ae$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-AU(Sydney)") echo "CF_API=https://api.cf.ap01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-ap$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-US(Sterling)") echo "CF_API=https://api.cf.us01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-us1$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-US-West(Colorado)") echo "CF_API=https://api.cf.us02.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-us2$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-JP(Tokyo)") echo "CF_API=https://api.cf.jp01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-jp$RANDOM_STR" >> $GITHUB_ENV ;;
            # 其他区域可按原来 workflow 添加
          esac
          if [ -n "${{ github.event.inputs.app_name }}" ]; then
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
          fi

      # 5️⃣ 登录 Cloud Foundry
      - name: Login to Cloud Foundry
        run: |
          cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"
          ORG=$(cf orgs | sed -n '4p'); echo "ORG=$ORG" >> $GITHUB_ENV
          SPACE=$(cf spaces | sed -n '4p'); echo "SPACE=$SPACE" >> $GITHUB_ENV
          cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

      # 6️⃣ 使用 Node.js 24 运行 _worker-keep.js
      - name: Run worker-keep
        run: |
          node _worker-keep.js

      # 7️⃣ 部署应用
      - name: Deploy application
        run: |
          if cf push ${{ env.APP_NAME }} --docker-image ${{ env.DOCKER_IMAGE }} -m ${{ env.MEMORY }} -k ${{ env.DISK }} --health-check-type port; then
            echo "Deployment successful"
          else
            cf delete ${{ env.APP_NAME }} -r -f
            echo "部署失败，已清理残留"
            exit 1
          fi

      # 8️⃣ 验证部署
      - name: Verify deployment
        run: |
          STATUS=$(cf app ${{ env.APP_NAME }} | grep "requested state:" | awk '{print $3}')
          if [ "$STATUS" = "started" ]; then
            echo "✅ merge启动成功"
          else
            echo "❌ 应用启动失败，当前状态: $STATUS"
            cf logs ${{ env.APP_NAME }} --recent
            exit 1
          fi

      # 9️⃣ 输出详细信息
      - name: Deployment info
        run: |
          echo "区域(Region): ${{ github.event.inputs.region }}"
          echo "组织(ORG): ${{ env.ORG }}"
          echo "空间(SPACE): ${{ env.SPACE }}"
          echo "应用名称(App Name): ${{ env.APP_NAME }}"
          ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')
          if [ -n "$ROUTE" ]; then
            echo "merge—URL: https://$ROUTE"
          else
            echo "⚠️ 未找到应用路由，请检查部署状态。"
          finame: 自动部署代理到SAP

on:
  workflow_dispatch:
    inputs:
      type:
        description: '选择部署的节点类型'
        required: true
        default: 'Argo隧道CDN'
        type: choice
        options:
          - ws直连
          - xhttp直连
          - Argo隧道CDN
      region:
        description: '选择部署区域'
        required: true
        default: 'US(free)'
        type: choice
        options:
          # 这里保持你原有的区域列表
          - SG(free)
          - US(free)
          - SAP-UAE(Dubai)
          - SAP-AU(Sydney)
          - SAP-US(Sterling)
          - SAP-US-West(Colorado)
          - SAP-JP(Tokyo)
          # AWS/GCP/Azure/SAP Neo 省略，可复制原来的

      app_name:
        description: '应用名称（可选，留空则自动生成）'
        required: false
        default: ''

env:
  MEMORY: 256M
  DISK: 300M

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      # 3️⃣ 安装 CF CLI
      - name: Install CF CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      # 4️⃣ 设置 CF API 和 APP 名
      - name: Determine CF API endpoint and app name
        run: |
          RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)
          case "${{ github.event.inputs.region }}" in
            "SG(free)") echo "CF_API=https://api.cf.ap21.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=free-sg$RANDOM_STR" >> $GITHUB_ENV ;;
            "US(free)") echo "CF_API=https://api.cf.us10-001.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=free-us$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-UAE(Dubai)") echo "CF_API=https://api.cf.ae01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-ae$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-AU(Sydney)") echo "CF_API=https://api.cf.ap01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-ap$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-US(Sterling)") echo "CF_API=https://api.cf.us01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-us1$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-US-West(Colorado)") echo "CF_API=https://api.cf.us02.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-us2$RANDOM_STR" >> $GITHUB_ENV ;;
            "SAP-JP(Tokyo)") echo "CF_API=https://api.cf.jp01.hana.ondemand.com" >> $GITHUB_ENV; echo "APP_NAME=sap-jp$RANDOM_STR" >> $GITHUB_ENV ;;
          esac
          if [ -n "${{ github.event.inputs.app_name }}" ]; then
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
          fi

          # 设置 Docker 镜像
          if [[ -n "${{ secrets.DOCKER_IMAGE }}" ]]; then
            echo "DOCKER_IMAGE=${{ secrets.DOCKER_IMAGE }}" >> $GITHUB_ENV
          else
            if [ "${{ github.event.inputs.type }}" = "ws直连" ]; then
              echo "DOCKER_IMAGE=ghcr.io/eooce/ws:latest" >> $GITHUB_ENV
            elif [ "${{ github.event.inputs.type }}" = "xhttp直连" ]; then
              echo "DOCKER_IMAGE=ghcr.io/eooce/goxhttp:latest" >> $GITHUB_ENV
            else
              echo "DOCKER_IMAGE=ghcr.io/eooce/nodejs:main" >> $GITHUB_ENV
            fi
          fi

      # 5️⃣ 登录 CF
      - name: Login to Cloud Foundry
        run: |
          cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"
          ORG=$(cf orgs | sed -n '4p'); echo "ORG=$ORG" >> $GITHUB_ENV
          SPACE=$(cf spaces | sed -n '4p'); echo "SPACE=$SPACE" >> $GITHUB_ENV
          cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

      # 6️⃣ 可选：运行 Node.js 脚本（如果你有 _worker-keep.js）
      - name: Run worker-keep (if exists)
        run: |
          if [ -f "_worker-keep.js" ]; then
            node _worker-keep.js
          fi

      # 7️⃣ 部署应用
      - name: Deploy application
        run: |
          if cf push ${{ env.APP_NAME }} --docker-image ${{ env.DOCKER_IMAGE }} -m ${{ env.MEMORY }} -k ${{ env.DISK }} --health-check-type port; then
            echo "Deployment successful"
          else
            cf delete ${{ env.APP_NAME }} -r -f
            echo "部署失败，已清理残留"
            exit 1
          fi

      # 8️⃣ 设置环境变量
      - name: Set environment variables
        run: |
          cf set-env ${{ env.APP_NAME }} NAME "SAP"
          cf set-env ${{ env.APP_NAME }} UUID "${{ secrets.UUID }}"
          cf set-env ${{ env.APP_NAME }} NEZHA_SERVER "${{ secrets.NEZHA_SERVER }}"
          cf set-env ${{ env.APP_NAME }} NEZHA_PORT "${{ secrets.NEZHA_PORT }}"
          cf set-env ${{ env.APP_NAME }} NEZHA_KEY "${{ secrets.NEZHA_KEY }}"
          cf set-env ${{ env.APP_NAME }} ARGO_PORT "${{ secrets.ARGO_PORT }}"
          cf set-env ${{ env.APP_NAME }} ARGO_DOMAIN "${{ secrets.ARGO_DOMAIN }}"
          cf set-env ${{ env.APP_NAME }} ARGO_AUTH "${{ secrets.ARGO_AUTH }}"
          cf set-env ${{ env.APP_NAME }} SUB_PATH "${{ secrets.SUB_PATH }}"
          cf set-env ${{ env.APP_NAME }} CFIP "${{ secrets.CFIP || 'cf.877774.xyz' }}"
          cf set-env ${{ env.APP_NAME }} CFPORT "${{ secrets.CFPORT }}"
          cf set-env ${{ env.APP_NAME }} CHAT_ID "${{ secrets.CHAT_ID }}"
          cf set-env ${{ env.APP_NAME }} BOT_TOKEN "${{ secrets.BOT_TOKEN }}"

      # 9️⃣ Restage 应用
      - name: Restage application
        run: |
          cf restage ${{ env.APP_NAME }}

      # 10️⃣ 验证部署
      - name: Verify deployment
        run: |
          cf app ${{ env.APP_NAME }}
          echo "Deployment completed successfully!"

      # 11️⃣ 输出详细信息
      - name: Deployment info
        run: |
          echo "区域(Region): ${{ github.event.inputs.region }}"
          echo "组织(ORG): ${{ env.ORG }}"
          echo "空间(SPACE): ${{ env.SPACE }}"
          echo "应用名称(App Name): ${{ env.APP_NAME }}"
          ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')
          if [ -n "$ROUTE" ]; then
            echo "应用 URL (APP_URL): https://$ROUTE"
          else
            echo "⚠️ 未找到应用路由，请检查部署状态。"
          fi
