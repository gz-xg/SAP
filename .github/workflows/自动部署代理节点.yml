name: 自动部署代理到SAP

on:
  workflow_dispatch:
    inputs:
      type:
        description: '选择部署的节点类型'
        required: true
        default: 'Argo隧道CDN'
        type: choice
        options:
          - ws直连
          - xhttp直连
          - Argo隧道CDN
      region:
        description: '选择部署区域'
        required: true
        default: 'US(free)'
        type: choice
        options:
          - SG(free)
          - US(free)
          - SAP-UAE(Dubai)
          - SAP-AU(Sydney)
          - SAP-US(Sterling)
          - SAP-US-West(Colorado)
          - SAP-JP(Tokyo)
          - AWS-AU(Sydney)
          - AWS-BR(São Paulo)
          - AWS-KR(Seoul)
          - AWS-CA(Montreal)
          - AWS-US(VA)
          - AWS-US(OR)
          - AWS-EU(Frankfurt)
          - AWS-JP(Tokyo)
          - AWS-SG(Singapore)
          - GCP-AU(Sydney)
          - GCP-BR(São Paulo)
          - GCP-US(IA)
          - GCP-EU(Frankfurt)
          - GCP-JP(Osaka)
          - GCP-JP(Tokyo)
          - GCP-IL(Tel Aviv)
          - GCP-IN(Mumbai)
          - GCP-KSA(Dammam)
          - Azure-AU(Sydney)
          - Azure-BR(São Paulo)
          - Azure-CA(Montreal)
          - Azure-US(VA)
          - Azure-US(WA)
          - Azure-EU(Netherlands)
          - Azure-JP(Tokyo)
          - Azure-SG(Singapore)
          - Neo-UAE(Dubai)
          - Neo-KSA(Riyadh)
      app_name:
        description: '应用名称（可选，留空则自动生成）'
        required: false
        default: ''

env:
  MEMORY: 256M
  DISK: 300M

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install CF CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      - name: Determine CF API endpoint and app name
        run: |
          RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)
          REGION="${{ github.event.inputs.region }}"
          APP_NAME="${{ github.event.inputs.app_name }}"

          case "$REGION" in
            "SG(free)") CF_API="https://api.cf.ap21.hana.ondemand.com"; APP_NAME=${APP_NAME:-free-sg$RANDOM_STR} ;;
            "US(free)") CF_API="https://api.cf.us10-001.hana.ondemand.com"; APP_NAME=${APP_NAME:-free-us$RANDOM_STR} ;;
            "SAP-UAE(Dubai)") CF_API="https://api.cf.ae01.hana.ondemand.com"; APP_NAME=${APP_NAME:-sap-ae$RANDOM_STR} ;;
            "SAP-AU(Sydney)") CF_API="https://api.cf.ap01.hana.ondemand.com"; APP_NAME=${APP_NAME:-sap-ap$RANDOM_STR} ;;
            "SAP-US(Sterling)") CF_API="https://api.cf.us01.hana.ondemand.com"; APP_NAME=${APP_NAME:-sap-us1$RANDOM_STR} ;;
            "SAP-US-West(Colorado)") CF_API="https://api.cf.us02.hana.ondemand.com"; APP_NAME=${APP_NAME:-sap-us2$RANDOM_STR} ;;
            "SAP-JP(Tokyo)") CF_API="https://api.cf.jp01.hana.ondemand.com"; APP_NAME=${APP_NAME:-sap-jp$RANDOM_STR} ;;
            # 其余区域同理，可按需补充
            *) CF_API="https://api.cf.ap21.hana.ondemand.com"; APP_NAME=${APP_NAME:-app$RANDOM_STR} ;;
          esac

          # 设置 Docker 镜像
          TYPE="${{ github.event.inputs.type }}"
          if [ -n "${{ secrets.DOCKER_IMAGE }}" ]; then
            DOCKER_IMAGE="${{ secrets.DOCKER_IMAGE }}"
          else
            case "$TYPE" in
              "ws直连") DOCKER_IMAGE="ghcr.io/eooce/ws:latest" ;;
              "xhttp直连") DOCKER_IMAGE="ghcr.io/eooce/goxhttp:latest" ;;
              *) DOCKER_IMAGE="ghcr.io/eooce/nodejs:main" ;;
            esac
          fi

          echo "CF_API=$CF_API" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "DOCKER_IMAGE=$DOCKER_IMAGE" >> $GITHUB_ENV

          echo "使用API端点: $CF_API"
          echo "应用名称: $APP_NAME"
          echo "部署类型: $DOCKER_IMAGE"

      - name: Login to Cloud Foundry
        run: |
          cf login -a $CF_API -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"
          ORG=$(cf orgs | sed -n '4p')
          SPACE=$(cf spaces | sed -n '4p')
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "SPACE=$SPACE" >> $GITHUB_ENV
          cf login -a $CF_API -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

      - name: Deploy application
        run: |
          if cf push $APP_NAME --docker-image $DOCKER_IMAGE -m ${{ env.MEMORY }} -k ${{ env.DISK }} --health-check-type port; then
            echo "Deployment successful"
          else
            cf delete $APP_NAME -r -f
            echo "部署失败，已清理残留，请稍后再尝试"
            exit 1
          fi

      - name: Set environment variables
        run: |
          CFIP="${{ secrets.CFIP }}"
          CFIP=${CFIP:-cf.877774.xyz}

          cf set-env $APP_NAME NAME "SAP"
          cf set-env $APP_NAME UUID "${{ secrets.UUID }}"
          cf set-env $APP_NAME NEZHA_SERVER "${{ secrets.NEZHA_SERVER }}"
          cf set-env $APP_NAME NEZHA_PORT "${{ secrets.NEZHA_PORT }}"
          cf set-env $APP_NAME NEZHA_KEY "${{ secrets.NEZHA_KEY }}"
          cf set-env $APP_NAME ARGO_PORT "${{ secrets.ARGO_PORT }}"
          cf set-env $APP_NAME ARGO_DOMAIN "${{ secrets.ARGO_DOMAIN }}"
          cf set-env $APP_NAME ARGO_AUTH "${{ secrets.ARGO_AUTH }}"
          cf set-env $APP_NAME SUB_PATH "${{ secrets.SUB_PATH }}"
          cf set-env $APP_NAME CFIP "$CFIP"
          cf set-env $APP_NAME CFPORT "${{ secrets.CFPORT }}"
          cf set-env $APP_NAME CHAT_ID "${{ secrets.CHAT_ID }}"
          cf set-env $APP_NAME BOT_TOKEN "${{ secrets.BOT_TOKEN }}"

          if [ -f .env ]; then
            while IFS= read -r line; do
              if [[ ! "$line" =~ ^# ]] && [[ -n "$line" ]]; then
                IFS='=' read -r key value <<< "$line"
                cf set-env $APP_NAME "$key" "$value"
              fi
            done < .env
          fi

          if [[ "$DOCKER_IMAGE" =~ (xhttp|goxhttp|ws) ]]; then
            ROUTE=$(cf app $APP_NAME | grep "routes:" | awk '{print $2}')
            if [ -n "$ROUTE" ]; then
              cf set-env $APP_NAME DOMAIN "$ROUTE"
            else
              echo "⚠️ 未找到应用路由，请手动设置 DOMAIN"
            fi
          fi

      - name: Restage application
        run: |
          cf restage $APP_NAME

      - name: Verify deployment
        run: |
          cf app $APP_NAME
          echo "Deployment completed successfully!"

      - name: Deployment details
        run: |
          echo "🚀 部署完成！"
          echo "区域: ${{ github.event.inputs.region }}"
          echo "组织: $ORG"
          echo "空间: $SPACE"
          echo "应用名称: $APP_NAME"
          ROUTE=$(cf app $APP_NAME | grep "routes:" | awk '{print $2}')
          if [ -n "$ROUTE" ]; then
            echo "应用 URL: https://$ROUTE"
          else
            echo "⚠️ 未找到应用路由，请检查部署状态。"
          fi
